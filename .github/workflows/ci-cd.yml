name: CI Pipeline

on:
  push:
    branches: [ main, develop, feature/*, agent/** ]
  pull_request:
    branches: [ main, develop ]

# أقل صلاحيات ممكنة للـ GITHUB_TOKEN الافتراضي — بدون هذا السطر يحصل التوكن
# على صلاحية قراءة/كتابة واسعة تلقائياً حتى لو ما يحتاجها أي job هنا فعلياً
# (كل الأعمال هنا قراءة فقط: checkout، فحص، بناء — بدون أي نشر أو كتابة
# حقيقية للمستودع حالياً). هذا ما كان يطلبه تنبيه CodeQL بالخمس مواضع.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # المشروع موحّد بالكامل على Node.js 24.
        node-version: [24.x]
        # يبقى الاختبار مقسومًا إلى الخادم والواجهة حتى يعزل أي فشل ويعرض
        # سببه بوضوح، مع وجود package.json إضافي في الجذر للتطوير المحلي.
        project: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ matrix.project }}/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Run linter
      run: npm run lint --if-present

    - name: Run tests
      run: npm test --if-present

    - name: Build project
      # --if-present لأن الباك إند (Node/Express) ما له سكربت "build" أصلاً
      # (سكربتاته فقط dev/start) — فقط الفرونت إند (Vite) يبني فعلياً.
      run: npm run build --if-present

  security-scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: ${{ matrix.project }}/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Reject tracked secrets and environment files
      if: matrix.project == 'backend'
      working-directory: ${{ github.workspace }}
      run: sh scripts/security-check.sh

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=moderate

    - name: Audit the complete dependency tree
      run: npm audit --audit-level=high

    - name: Check lockfile integrity
      run: npm ls --all

  web-v39-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-v39

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    - name: Install locked dependencies
      run: npm run install:ci

    - name: Audit the complete dependency tree
      run: npm audit --audit-level=high

    - name: Run linter
      run: npm run lint

    - name: Build and run tests
      run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build full web production image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./backend/Dockerfile
        push: false
        tags: rakaez-erp:${{ github.sha }}

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rakaez_ci
          POSTGRES_USER: rakaez_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rakaez_ci -d rakaez_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://rakaez_ci:ci-only-password@127.0.0.1:5432/rakaez_ci
      DB_SSL: "false"
      NODE_ENV: test
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - run: npm ci --ignore-scripts
    - name: Create Supabase-compatible CI roles
      run: |
        node --input-type=module <<'NODE'
        import pg from "pg";

        const client = new pg.Client({
          connectionString: process.env.DATABASE_URL,
        });

        await client.connect();
        try {
          await client.query("CREATE ROLE anon NOLOGIN");
          await client.query("CREATE ROLE authenticated NOLOGIN");
        } finally {
          await client.end();
        }
        NODE
    - name: Apply every migration to a clean database
      run: npm run migrate
    - name: Verify the migration result
      run: node dbtest.mjs
