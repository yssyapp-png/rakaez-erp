name: CI Pipeline

on:
  push:
    branches: [ main, develop, feature/*, agent/** ]
  pull_request:
    branches: [ main, develop ]

# أقل صلاحيات ممكنة للـ GITHUB_TOKEN الافتراضي — بدون هذا السطر يحصل التوكن
# على صلاحية قراءة/كتابة واسعة تلقائياً حتى لو ما يحتاجها أي job هنا فعلياً
# (كل الأعمال هنا قراءة فقط: checkout، فحص، بناء — بدون أي نشر أو كتابة
# حقيقية للمستودع حالياً). هذا ما كان يطلبه تنبيه CodeQL بالخمس مواضع.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # اختبر فقط على إصدارات Node المدعومة المستخدمة في الإنتاج.
        node-version: [24.x]
        # المشروع مقسوم لمجلدين منفصلين، كل واحد فيه package.json خاص به —
        # لا يوجد package.json بجذر المستودع. هذا هو سبب فشل ٣ من ٨ فحوصات
        # سابقاً: الخطوات كانت تشتغل بالجذر مباشرة بدون تحديد working-directory
        # فتفشل فوراً على "npm ci" (ما تلقى ملف package.json أصلاً).
        project: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ matrix.project }}/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Run linter
      run: npm run lint --if-present

    - name: Run tests
      run: npm test --if-present

    - name: Build project
      # --if-present لأن الباك إند (Node/Express) ما له سكربت "build" أصلاً
      # (سكربتاته فقط dev/start) — فقط الفرونت إند (Vite) يبني فعلياً.
      run: npm run build --if-present

  security-scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: ${{ matrix.project }}/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Reject tracked secrets and environment files
      if: matrix.project == 'backend'
      working-directory: ${{ github.workspace }}
      run: sh scripts/security-check.sh

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=moderate

    - name: Audit the complete dependency tree
      run: npm audit --audit-level=high

    - name: Check lockfile integrity
      run: npm ls --all

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build full web production image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./backend/Dockerfile
        push: false
        tags: rakaez-erp:${{ github.sha }}
